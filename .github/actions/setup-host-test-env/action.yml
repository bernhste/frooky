name: Setup Test Environment for Hosts
description: Download the current frooky host and install it
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Download host artifact
      uses: actions/download-artifact@v8
      with:
        name: frooky-host
        path: dist

    - name: Install frooky and dev dependencies
      shell: bash
      run: |
        uv venv
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

        echo "Installing frooky"
        uv pip install dist/*.whl

        echo "Installing dev dependencies from pyproject.toml"
        uv pip install --group dev -r pyproject.toml
