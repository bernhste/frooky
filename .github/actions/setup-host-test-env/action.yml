name: Setup Test Environment for Hosts
description: Download the current frooky host and install it
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
        python-version: "3.14"
        activate-environment: true

    - name: Download host artifact
      uses: actions/download-artifact@v8
      with:
        name: frooky-host
        path: dist

    # locked dependencies first, then the built wheel instead of an editable install of the source tree
    - name: Install frooky and dev dependencies
      shell: bash
      run: |
        uv sync --locked --no-install-project
        uv pip install dist/*.whl
