name: Test host Android

on:
  push:
  # all API levels unless api-levels is set; a push tests API 31-35 (Android 12, 12L, 13-15)
  workflow_dispatch:
    inputs:
      api-levels:
        description: "Comma-separated Android API levels, e.g. 36 or 29, 36. Empty: all."
        default: ""

permissions:
  contents: read

jobs:
  build-host:
    uses: ./.github/workflows/build-host.yml

  build-target-apps-android:
    uses: ./.github/workflows/build-target-apps-android.yml

  test-host-android:
    name: Test host Android (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(github.event_name == 'push' && '[31, 32, 33, 34, 35]' || inputs.api-levels && format('[{0}]', inputs.api-levels) || '[29, 31, 32, 33, 34, 35, 36]') }}
    needs:
      - build-host
      - build-target-apps-android
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download MAS app Android artifact
        uses: actions/download-artifact@v8
        with:
          name: target-apps-android
          path: target-apps-android

      - name: Setup Host Test Environment
        uses: ./.github/actions/setup-host-test-env

      - name: Setup Android emulator environment
        uses: ./.github/actions/setup-android-emulator
        with:
          api-level: ${{ matrix.api-level }}

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Preparing scripts"
            chmod +x .github/scripts/android/install-run-appium.sh
            chmod +x .github/scripts/android/prep-device.sh
            chmod +x .github/scripts/android/install-frida-server.sh

            echo "Installing and running Appium"
            .github/scripts/android/install-run-appium.sh

            echo "Starting adb as root"
            .github/scripts/android/prep-device.sh

            echo "Installing frida server"
            .github/scripts/android/install-frida-server.sh

            echo "Installing target apps"
            find target-apps-android/ -name "*.apk" -exec adb install {} \;

            echo "Run tests"
            pytest tests/integration/android --report-log=test-results-android.json

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize-test-results.py pytest test-results-android.json "Host integration tests (Android API ${{ matrix.api-level }})"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-android-api${{ matrix.api-level }}
          path: test-results-android.json