name: Build frooky host

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-agent:
    uses: ./.github/workflows/build-agent.yml

  build-host:
    name: Build frooky host
    needs: build-agent
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download frooky agent artifact
        uses: actions/download-artifact@v8
        with:
          name: frooky-agent
          path: frooky/agent/dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build frooky package
        run: uv build

      - name: Check build artifacts
        run: |
          ls -lh dist/
          test -f dist/*.whl
          test -f dist/*.tar.gz

      - name: Upload frooky host artifact
        uses: actions/upload-artifact@v7
        with:
          name: frooky-host
          path: dist/*
