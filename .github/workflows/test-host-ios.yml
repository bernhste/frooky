name: Test host iOS

on:
  push:

permissions:
  contents: read

jobs:
  build-host:
    uses: ./.github/workflows/build-host.yml

  build-target-apps-ios:
    uses: ./.github/workflows/build-target-apps-ios.yml

  test-host-ios:
    name: Test host iOS
    runs-on: macos-26
    needs:
      - build-host
      - build-target-apps-ios
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download MAS app iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: target-apps-ios
          path: target-apps-ios

      - name: Setup Host Test Environment
        uses: ./.github/actions/setup-host-test-env

      - name: Boot simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | \
            jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]] | map(select(.isAvailable == true)) | first | .udid')
          echo "Booting simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Install and run app on simulator
        run: |
          for app_path in target-apps-ios/*.app; do

            BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$app_path/Info.plist")

            echo "Installing $BUNDLE_ID..."
            xcrun simctl install booted "$app_path"

            echo "Launching $BUNDLE_ID..."
            PID=$(xcrun simctl launch booted "$BUNDLE_ID" | awk '{print $2}')
            echo "Launched with PID $PID"

            # Verification loop
            for i in $(seq 1 10); do
              if kill -0 "$PID" 2>/dev/null; then
                echo "App $BUNDLE_ID is running (PID $PID)."
                echo "TBD: run integration tests for iOS"
                exit 0
              fi
              echo "Attempt $i: app not running yet, retrying in 2s..."
              sleep 2
            done

            echo "App $BUNDLE_ID did not start within the timeout."
            exit 1
          done


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: test-results-ios.txt