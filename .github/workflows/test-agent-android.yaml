name: Test agent Android

on:
  push:
  # all API levels unless api-levels is set; a push tests only API 34
  workflow_dispatch:
    inputs:
      api-levels:
        description: 'Android API levels as a JSON list, e.g. ["29", "36"]. Empty: all.'
        default: ""

permissions:
  contents: read

jobs:
  test-agent-android:
    name: Test agent Android (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(github.event_name == 'push' && '["34"]' || inputs.api-levels || '["29", "31", "33", "34", "35", "36"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frooky/agent/package-lock.json"

      - name: Install dependencies
        working-directory: frooky/agent
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          python-version: "3.14"
          activate-environment: true

      # frida and frida-tools from uv.lock; install-frida-server.sh matches the server to `frida --version`
      - name: Install frida-tools
        run: uv sync --locked --no-install-project --no-dev

      - name: Setup Android emulator environment
        uses: ./.github/actions/setup-android-emulator
        with:
          api-level: ${{ matrix.api-level }}

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Preparing scripts"
            chmod +x .github/scripts/android/prep-device.sh
            chmod +x .github/scripts/android/install-frida-server.sh

            echo "Starting adb as root"
            .github/scripts/android/prep-device.sh

            echo "Installing frida server"
            .github/scripts/android/install-frida-server.sh

            echo "Run tests"
            cd frooky/agent && npm run test:android -- -o test-results-agent-android.json

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize-test-results.py frida-test frooky/agent/test-results-agent-android.json "Agent tests (Android API ${{ matrix.api-level }})"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-agent-android-api${{ matrix.api-level }}
          path: frooky/agent/test-results-agent-android.json
