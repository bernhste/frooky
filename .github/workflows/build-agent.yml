name: Build frooky agent

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-agent:
    name: Build frooky agent
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frooky/agent/package-lock.json"

      - name: Install dependencies
        working-directory: frooky/agent
        run: npm ci

      # the schemas are generated from the hook-file types, so a difference means they weren't regenerated after a
      # change to the types
      - name: Check generated schemas
        working-directory: frooky/agent
        run: |
          npm run build:zodSchema
          npm run build:jsonSchema
          changes=$(git status --porcelain -- src/shared/inputParsing/zodSchemas ../../docs/schema)
          if [ -n "$changes" ]; then
            echo "::error::The generated schemas are out of date. Run 'npm run build:zodSchema && npm run build:jsonSchema' in frooky/agent and commit the result."
            echo "$changes"
            git --no-pager diff -- src/shared/inputParsing/zodSchemas ../../docs/schema
            exit 1
          fi

      - name: Build frooky agent
        working-directory: frooky/agent
        run: npm run build:prod:android

      - name: Upload frooky agent artifact
        uses: actions/upload-artifact@v7
        with:
          name: frooky-agent
          path: frooky/agent/dist/*
