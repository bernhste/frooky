name: "Test: Host Unit Tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Host unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # github.event_name is the caller's event: a push tests one configuration, other events all of them
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15", "windows-2025"]') }}
        python: ${{ fromJSON(github.event_name == 'push' && '["3.14"]' || '["3.12", "3.14"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frooky/agent/package-lock.json"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Compile frooky agent
        run: uv run compile-agent --dev

      - name: Run host unit tests
        run: uv run pytest tests/unit --report-log=test-results.jsonl

      - name: Summarize test results
        if: always()
        run: uv run python .github/scripts/summarize-test-results.py pytest test-results.jsonl "Host unit tests (${{ matrix.os }}, Python ${{ matrix.python }})"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.jsonl
