name: Verify frooky host

on:
  workflow_call:
  push:

permissions:
  contents: read

jobs:
  build-host:
    uses: ./.github/workflows/build-host.yml

  test-host-unit:
    uses: ./.github/workflows/test-host-unit.yml

  verify-host:
    name: Verify host
    runs-on: ubuntu-24.04
    needs: build-host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Download host artifact
        uses: actions/download-artifact@v8
        with:
          name: frooky-host
          path: dist

      - name: Install wheel
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install dist/*.whl

      - name: Verify frooky CLI
        run: frooky --help

      - name: Check agent artifacts
        run: |
          unzip -l dist/*.whl | grep "frooky/agent/dist/agent-android.js"
          echo "All agent artifacts present in wheel"
