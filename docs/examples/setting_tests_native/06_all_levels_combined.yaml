metadata:
  name: Native Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default setttings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     fastDecode: false,
#     magicDecode: false,
#     maxRecursion: 10,
#     decodeLimit: 1000,
#     customDecoder: undefined,
#     decoderArg: undefined,
#     paramFilter: undefined,

settings:
  hookSettings:
    stackTraceLimit: 5
  decoderSettings:
    maxRecursion: 1
    decodeLimit: 1

hookGroup:
  - module: libc.so
    hookSettings:
      stackTraceLimit: 30
      stackTraceFilter: ["^L3"]
    decoderSettings:
      maxRecursion: 30
      decodeLimit: 30
    hooks:
    - symbol: open
      retType: int
      hookSettings:
        stackTraceLimit: 40
        stackTraceFilter: ["^L4"]
      decoderSettings:
        maxRecursion: 40
        decodeLimit: 40
      params:
      - [const char *, path, { maxRecursion: 50, decodeLimit: 50 }]
      - [int, flags]
      - [mode_t, mode]

# All levels set a value for this single hook/param, from farthest to closest:
#   1. default (hard-coded)           -> stackTraceLimit=0,  maxRecursion=10, decodeLimit=1000
#   2. file-level `settings:`         -> stackTraceLimit=5,  maxRecursion=1,  decodeLimit=1
#   3. hook group (`module` block)    -> stackTraceLimit=30, maxRecursion=30, decodeLimit=30
#   4. individual hook (`symbol:` block) -> stackTraceLimit=40, maxRecursion=40, decodeLimit=40
#   5. param (`path`, decoder settings only, closest level) -> maxRecursion=50, decodeLimit=50
#
# Each level overrides everything farther away, and only the fields it actually sets - anything it
# leaves out falls through to the next level out.
#
# expected applied settings:
#   hook-level hookSettings (stackTraceLimit / stackTraceFilter): 40 / ["^L4"]
#     -> level 4 wins over the group's 30 / ["^L3"]; hookSettings has no level closer than the hook
#   hook-level decoderSettings (used e.g. for `retType`): 40 / 40
#     -> level 4 wins over the group's 30 / 30
#   `path` param decoderSettings: 50 / 50
#     -> level 5 wins, since a param-level override is closer than the hook it belongs to
