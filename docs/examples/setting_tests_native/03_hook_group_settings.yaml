metadata:
  name: Native Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default settings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     hashCode: false
#     maxDepth: 10
#     maxItems: 100
#     decoder: undefined
#     decoderArg: undefined
#     argFilter: undefined

settings:
  hookSettings:
    stackTraceLimit: 5
  decoderSettings:
    maxDepth: 1
    maxItems: 1

hookCollection:
  - module: libc.so
    hookSettings:
      stackTraceLimit: 30
      stackTraceFilter: ["^L3"]
    decoderSettings:
      maxDepth: 30
      maxItems: 30
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path]
      - [int, flags]
      - [mode_t, mode]

# expected: the hook group's own `hookSettings`/`decoderSettings` (set directly on the `module`
# block, one level closer to the hook than the file-level `settings:` above) take precedence over
# both the file-level settings and the hard-coded defaults.
#
# expected applied settings for `open`:
#   stackTraceLimit:   30        (group; overrides file's 5 and default's 0)
#   stackTraceFilter:  ["^L3"]   (group; overrides file's [] )
#   maxDepth:          30        (group; overrides file's 1 and default's 10)
#   maxItems:          30        (group; overrides file's 1 and default's 100)
#   hashCode:          false     (default; never overridden at any level here)
