metadata:
  name: Native Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default settings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     hashCode: false
#     maxDepth: 10
#     maxItems: 100
#     decoder: undefined
#     decoderArg: undefined
#     argFilter: undefined

hookCollection:
  - module: libc.so
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path]
      - [int, flags]
      - [mode_t, mode]

# expected: all hooks should inherite the settings from default
