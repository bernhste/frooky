metadata:
  name: Native Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default settings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     hashCode: false
#     maxDepth: 10
#     maxItems: 100
#     decoder: undefined
#     decoderArg: undefined
#     argFilter: undefined

settings:
  hookSettings:
    stackTraceLimit: 5
  decoderSettings:
    maxDepth: 1
    maxItems: 1

hookCollection:
  - module: libc.so
    hookSettings:
      stackTraceLimit: 30
      stackTraceFilter: ["^L3"]
    decoderSettings:
      maxDepth: 30
      maxItems: 30
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path, { maxDepth: 50, maxItems: 50 }]
      - [int, flags]
      - [mode_t, mode]

# Unlike hook-level settings (see 04_single_hook_settings.yaml), param-level decoder settings
# (inline on a param declaration) are also a level closer than the hook group: `normalizeInputParam()`
# merges these on top of the hook group's merged `decoderSettings`.
#
# expected applied decoder settings for the `path` parameter of `open`:
#   maxDepth: 50   (param; closest level, overrides group's 30, file's 1, default's 10)
#   maxItems: 50   (param; closest level, overrides group's 30, file's 1, default's 100)
#
# `hookSettings` (stackTraceLimit/stackTraceFilter) have no per-param equivalent, so those stay at
# the hook group's values:
#   stackTraceLimit:  30
#   stackTraceFilter: ["^L3"]
