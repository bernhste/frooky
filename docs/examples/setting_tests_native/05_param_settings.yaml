metadata:
  name: Native Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default setttings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     fastDecode: false,
#     magicDecode: false,
#     maxRecursion: 10,
#     decodeLimit: 1000,
#     customDecoder: undefined,
#     decoderArg: undefined,
#     paramFilter: undefined,

settings:
  hookSettings:
    stackTraceLimit: 5
  decoderSettings:
    maxRecursion: 1
    decodeLimit: 1

hookCollection:
  - module: libc.so
    hookSettings:
      stackTraceLimit: 30
      stackTraceFilter: ["^L3"]
    decoderSettings:
      maxRecursion: 30
      decodeLimit: 30
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path, { maxRecursion: 50, decodeLimit: 50 }]
      - [int, flags]
      - [mode_t, mode]

# Unlike hook-level settings (see 04_single_hook_settings.yaml), param-level decoder settings
# (inline on a param declaration) are also a level closer than the hook group: `normalizeInputParam()`
# merges these on top of the hook group's merged `decoderSettings`.
#
# expected applied decoder settings for the `path` parameter of `open`:
#   maxRecursion: 50   (param; closest level, overrides group's 30, file's 1, default's 10)
#   decodeLimit:  50   (param; closest level, overrides group's 30, file's 1, default's 1000)
#
# `hookSettings` (stackTraceLimit/stackTraceFilter) have no per-param equivalent, so those stay at
# the hook group's values:
#   stackTraceLimit:  30
#   stackTraceFilter: ["^L3"]
