metadata:
  name: Android Hooks for Testing
  version: 1
  author: frooky dev
  platform: Android

# default settings from DEFAULT_FROOKY_SETTINGS: FrookySettings
# settings:
#   hookSettings:
#     stackTraceLimit: 0
#     stackTraceFilter: []
#   decoderSettings:
#     hashCode: false
#     maxDepth: 10
#     maxItems: 100
#     decoder: undefined
#     decoderArg: undefined
#     argFilter: undefined

settings:
  hookSettings:
    stackTraceLimit: 5
  decoderSettings:
    maxDepth: 1
    maxItems: 1

hookCollection:
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      stackTraceLimit: 30
      stackTraceFilter: ["^L3"]
    decoderSettings:
      maxDepth: 30
      maxItems: 30
    hooks:
    - method: receiveNestedObjectArray
      hookSettings:
        stackTraceLimit: 40
        stackTraceFilter: ["^L4"]
      decoderSettings:
        maxDepth: 40
        maxItems: 40

# `InputJavaHookNormalized` (the object form of a single hook entry) declares its own optional
# `hookSettings`/`decoderSettings` fields, one level closer to the hook than the hook group's
# settings set on the `javaClass` block, so they take precedence.
#
# expected applied settings for `receiveNestedObjectArray`:
#   stackTraceLimit:  40         (hook; overrides group's 30, file's 5, default's 0)
#   stackTraceFilter: ["^L4"]    (hook; overrides group's ["^L3"])
#   maxDepth:         40         (hook; overrides group's 30, file's 1, default's 10)
#   maxItems:         40         (hook; overrides group's 30, file's 1, default's 100)
