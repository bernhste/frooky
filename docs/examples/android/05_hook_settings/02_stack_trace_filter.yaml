metadata:
  name: "Hook Settings (Android): stackTraceFilter"
  description: |
    `stackTraceFilter` only records a call if a captured frame matches one of the regular expressions,
    e.g. to keep the calls made by the app and drop those made by libraries or the framework.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-java (MastgTest.kt), press "Start".
# Run:    frooky -U -f value_passing_java.frooky.target.app docs/examples/android/05_hook_settings/02_stack_trace_filter.yaml
# See:    docs/additional-features.md#event-filter-based-on-stack-trace
#
# What the filter matches:
# - Each frame on its own, as it appears in the event: "<class>.<method> (<file>:<line>)".
# - Only the captured frames: it needs `platformStackTrace` (or `nativeStackTrace` for native hooks), otherwise
#   every event is dropped, and it only searches the first `maxStackFrames` frames.
# - If any frame matches, the whole event is kept, with all captured frames.

hookCollection:
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      platformStackTrace: true
      # frame 1 is trackEvent itself, frame 2 its caller
      maxStackFrames: 2
      stackTraceFilter: ['^org\.owasp\.mastestapp\.MastgTest\.mastgTest ']
    hooks:
      # called directly by mastgTest ("button_click") and through ThirdPartySdk.flush ("sdk_flush")
      - trackEvent

# Expected events:
#   trackEvent: only "button_click". The "sdk_flush" call has mastgTest as its third frame, which is not searched.
