metadata:
  name: "Decoder Settings (Android): argFilter"
  description: |
    `argFilter` only records a call if the decoded argument matches one of the regular expressions or numeric comparisons.
    It matches the decoded value as it appears in the event, so after `maxItems` cut it.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-java (MastgTest.kt), press "Start".
# Run:    frooky -U -f value_passing_java.frooky.target.app docs/examples/android/04_decoder_settings/03_arg_filter.yaml
# See:    docs/decoders.md#argfilter-capture-only-matching-values

hookCollections:
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      # trackEvent is called with "button_click" and "sdk_flush"
      - method: trackEvent
        overloads:
          - params:
              - [java.lang.String, name, { argFilter: ["^button_"] }]

      # a numeric filter captures values matching a comparison operator (>, >=, <, <=, ==, !=)
      - method: receiveInt
        overloads:
          - params:
              - [int, value, { argFilter: ["> 1000"] }]
      # whole numbers are compared exactly, also a long beyond 2^53: receiveLong is called with Long.MAX_VALUE,
      # 9223372036854775807, so only the first of these two hooks records it
      - method: receiveLong
        overloads:
          - params:
              - [long, max, { argFilter: ["== 9223372036854775807"] }]
      - method: receiveLong
        overloads:
          - params:
              - [long, oneLess, { argFilter: ["== 9223372036854775806"] }]

# Expected events:
#   trackEvent:  only name "button_click"
#   receiveInt:  value 2147483647
#   receiveLong: one event, max "9223372036854775807" (a string: JSON numbers can't hold every long)
