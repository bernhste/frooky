metadata:
  name: "Decoder Settings (Android): decoderArgs"
  description: |
    `decoderArgs` passes the values of other parameters to a decoder, each in a role. With the roles
    `offset` and `length`, an array is decoded only from `offset` for `length` elements, e.g. the key
    that a method takes from the middle of a larger buffer.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-java (MastgTest.kt), press "Start".
# Run:    frooky -U -f value_passing_java.frooky.target.app docs/examples/android/04_decoder_settings/04_decoder_args.yaml
# See:    docs/decoders.md#decoderargs-pass-values-to-the-decoder-by-role

hookCollection:
  # SecretKeySpec(byte[] key, int offset, int len, String algorithm) uses only `len` bytes of `key` from `offset`.
  # Without decoderArgs, the whole buffer would be shown as the key.
  # Docs: https://developer.android.com/reference/javax/crypto/spec/SecretKeySpec#SecretKeySpec(byte[],%20int,%20int,%20java.lang.String)
  - javaClass: javax.crypto.spec.SecretKeySpec
    hooks:
      - method: $init
        overloads:
          - params:
              - ["[B", key, { decoderArgs: { offset: offset, length: len } }]
              - [int, offset]
              - [int, len]
              - [java.lang.String, algorithm]

  # sendPacket(byte[] buffer, int offset, int length) sends "hello frooky", the 12 bytes from offset 7 of
  # "HEADER|hello frooky|TRAILER". `decoder: string` accepts the same roles and decodes the slice as text.
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: sendPacket
        overloads:
          - params:
              - ["[B", buffer, { decoder: string, decoderArgs: { offset: offset, length: length } }]
              - [int, offset]
              - [int, length]

# Expected values (argsIn):
#   SecretKeySpec.$init: key [16, 17, ..., 31] (the 16 bytes from offset 16), offset 16, len 16, algorithm "AES"
#   sendPacket:          buffer "hello frooky", offset 7, length 12
