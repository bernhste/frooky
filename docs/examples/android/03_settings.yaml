metadata:
  name: Android Settings Hierarchy Testing
  description: |
    Demonstrates setting inheritance in frooky across the file, hook collection,
    hook, and parameter levels for Android Java hooks:

    1. File Settings (`settings:`):
       Apply to all hooks and decoders across the file unless overridden.

    2. Hook Collection Settings (`hookSettings` / `decoderSettings` under `javaClass`):
       Override file settings for all hooks within that class.

    3. Hook-Level Settings:
       Override hook collection and file settings for a specific method hook.

    4. Parameter Settings:
       Override decoder settings for individual parameters.
  version: 1
  author: frooky dev
  platform: Android

# File settings for all hooks in this file.
# See docs/additional-features.md#settings-precedence and setting_tests/ for one example per level.
settings:
  hookSettings:
    maxStackFrames: 10
  decoderSettings:
    maxDepth: 1
    maxItems: 11

hookCollection:
  # Simple method declaration (inherits file settings)
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - receiveBoolean

  # Object with only method name provided (inherits file settings)
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: receiveByte

  # Partial local hook settings take priority over file settings
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 2
    decoderSettings:
      maxItems: 22
    hooks:
      - receiveShort
      - receiveInt

  # Partial local hook settings take priority over file settings (method object form)
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 3
    decoderSettings:
      maxItems: 33
    hooks:
      - method: receiveLong

  # Partial local hook settings with multiple methods
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 4
    decoderSettings:
      maxItems: 44
    hooks:
      - receiveFloat
      - receiveDouble

  # Partial local parameter settings take priority over file settings: [type, settings]
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 0
    hooks:
      - method: receiveIntArray
        overloads:
          - params:
              - ["[I", { maxItems: 55 }]

  # Parameter settings with name: [type, name]
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: receiveNestedPrimitivesArray
        overloads:
          - params:
              - ["[[[I", nestedIntegerInput]

  # Complex common Java types
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - receiveBigInteger
      - receiveBigDecimal
      - receiveList
      - receiveMap
      - receiveSet
      - receiveEnum
