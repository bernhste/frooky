metadata:
  name: "Settings Precedence (Android): Hook"
  description: |
    Settings on a single hook (the `method`/`symbol` entry) override the hook collection and file-level
    settings for that hook only.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file `settings` < hook collection < hook < parameter/return type.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-java test app, which calls MastgTest.receiveString("Welcome the first OWASP MASCon 📱❤️") once.

settings:
  hookSettings:
    platformStackTrace: true
    maxStackFrames: 1
    callerFilter:
      - org.owasp.mastestapp
  decoderSettings:
    maxItems: 10

hookCollection:
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 2
    decoderSettings:
      maxItems: 15
    hooks:
      - method: receiveString
        hookSettings:
          maxStackFrames: 3
        decoderSettings:
          maxItems: 20
        overloads:
          - params:
              - [java.lang.String, arg]

# Expected event after pressing Start:
#   stackTrace:        3 frames in platformStackTrace (hook: maxStackFrames 3); the callerFilter keeps the event, as org.owasp.mastestapp code calls receiveString
#   argsIn[0].value:   "Welcome the first OW..."                (hook: maxItems 20)
#   returnValue.value: "Welcome the first OW..."                (hook: maxItems 20)
