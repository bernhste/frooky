metadata:
  name: "Settings Precedence (Android): File"
  description: |
    The file-level `settings` override the defaults for every hook in the file.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file < hook collection < hook < parameter/return value.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-java test app, which calls MastgTest.receiveString("Welcome the first OWASP MASCon 📱❤️") once.

hookSettings:
  javaStackTrace: true
  maxStackFrames: 1
  callerFilter:
    - org.owasp.mastestapp
decoderSettings:
  maxItems: 10

hookCollections:
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: receiveString
        overloads:
          - params:
              - [java.lang.String, arg]

# Expected event after pressing Start:
#   stackTrace:        1 frame in javaStackTrace (file: maxStackFrames 1); the callerFilter keeps the event, as org.owasp.mastestapp code calls receiveString
#   argsIn[0].value:   "Welcome th..."                          (file: maxItems 10)
#   returnValue.value: "Welcome th..."                          (file: maxItems 10)
