metadata:
  name: "Settings Precedence (Android): Parameter and Return Type"
  description: |
    Decoder settings on a parameter or the return type are the closest level. They override all
    other levels for that one value. There are no hook settings at this level.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file < hook collection < hook < parameter/return value.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-java test app, which calls MastgTest.receiveString("Welcome the first OWASP MASCon 📱❤️") once.

hookSettings:
  javaStackTrace: true
  maxStackFrames: 1
  callerFilter:
    - org.owasp.mastestapp
decoderSettings:
  maxItems: 10

hookCollections:
  - javaClass: org.owasp.mastestapp.MastgTest
    hookSettings:
      maxStackFrames: 2
    decoderSettings:
      maxItems: 15
    hooks:
      - method: receiveString
        hookSettings:
          maxStackFrames: 3
        decoderSettings:
          maxItems: 20
        overloads:
          - params:
              - [java.lang.String, arg, { maxItems: 25 }]
            returns: { maxItems: 30 }

# Expected event after pressing Start:
#   stackTrace:        3 frames in javaStackTrace (hook: maxStackFrames 3); the callerFilter keeps the event, as org.owasp.mastestapp code calls receiveString
#   argsIn[0].value:   "Welcome the first OWASP M..."           (parameter: maxItems 25)
#   returnValue.value: "Welcome the first OWASP MASCon..."      (return type: maxItems 30)
