metadata:
  name: "Settings Precedence (Android): Partial Overrides"
  description: |
    Each level only overrides the fields it sets; everything else falls through to the next level
    out. Here every setting comes from a different level.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file < hook collection < hook < parameter/return value.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-java test app, which calls MastgTest.receiveString("Welcome the first OWASP MASCon 📱❤️") once.

hookSettings:
  javaStackTrace: true
  maxStackFrames: 1

hookCollections:
  - javaClass: org.owasp.mastestapp.MastgTest
    decoderSettings:
      maxItems: 15
    hooks:
      - method: receiveString
        hookSettings:
          maxStackFrames: 3
        overloads:
          - params:
              - [java.lang.String, arg]
            returns: { maxItems: 30 }

# Expected event after pressing Start:
#   stackTrace:        3 frames in javaStackTrace (hook: maxStackFrames 3); turning the stack traces on still comes from the file
#   argsIn[0].value:   "Welcome the fir..."                     (hook collection: maxItems 15)
#   returnValue.value: "Welcome the first OWASP MASCon..."      (return type: maxItems 30)
