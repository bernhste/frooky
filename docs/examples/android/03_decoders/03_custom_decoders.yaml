metadata:
  name: "Decoders (Android): Custom Decoders"
  description: |
    `decoder` replaces the decoder chosen by type with a registered custom decoder, e.g. to show a
    byte array or a char array as text, base64 as the bytes it encodes, an object by its identity
    or its getters, an int as the name of a constant, or a bitmask as the names of its flags.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-java (MastgTest.kt), press "Start".
# Run:    frooky -U -f value_passing_java.frooky.target.app docs/examples/android/03_decoders/03_custom_decoders.yaml
# See:    docs/decoders.md#built-in-decoders

hookCollection:
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      # `string`: a byte[] as text, instead of a list of numbers
      - method: receiveTextBytes
        overloads:
          - params:
              - ["[B", text, { decoder: string }]

      # `string` on a char[]: text, e.g. a password, instead of a list of characters
      - method: receivePassword
        overloads:
          - params:
              - ["[C", password, { decoder: string }]

      # `hex`: a byte[] as one hex string, instead of a list of numbers
      - method: receiveByteArray
        overloads:
          - params:
              - ["[B", bytes, { decoder: hex }]

      # `hex` on an integer: its bits as hex, e.g. Int.MAX_VALUE as 0x7fffffff
      - method: receiveInt
        overloads:
          - params:
              - [int, number, { decoder: hex }]

      # `base64`: the decoded bytes of base64 text, as text if they're printable, otherwise as hex, e.g. a key
      - method: receiveBase64
        overloads:
          - params:
              - [java.lang.String, encoded, { decoder: base64 }]

      # `getters`: the values of the get*() and is*() methods, e.g. of an app class without a decoder
      - method: receiveProfile
        overloads:
          - params:
              - [org.owasp.mastestapp.UserProfile, profile, { decoder: getters }]

      # `hashCode`: <class>@<System.identityHashCode()>, without calling the object's own toString() or hashCode().
      # The hash code is the same as the `hashCode` of events about the same object.
      - method: receiveBigInteger
        overloads:
          - params:
              - [java.math.BigInteger, number, { decoder: hashCode }]

      # `constants`: the name of the matching static final constant of the hooked class (MODE_ENCRYPT = 1, MODE_DECRYPT = 2)
      - method: receiveMode
        overloads:
          - params:
              - [int, mode, { decoder: constants }]

      # `constants` with `config: { constants }`: the names you declare instead of the constants of the hooked class, e.g. for
      # constants declared on another class, or an obfuscated app whose fields have no meaningful names
      - method: receiveMode
        overloads:
          - params:
              - [int, opmode, { decoder: constants, config: { constants: { ENCRYPT: 1, DECRYPT: 2 } } }]

  # `bitmask` with `class`: the names of the constants whose bits are set in a bitmask. The purposes of a Keystore key
  # are a bitmask of KeyProperties.PURPOSE_*, which aren't declared on the hooked Builder class, so `class` names the
  # class and `fields` the constants of it to use.
  # Docs: https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec.Builder#Builder(java.lang.String,%20int)
  - javaClass: android.security.keystore.KeyGenParameterSpec$Builder
    hooks:
      - method: $init
        overloads:
          - params:
              - [java.lang.String, keystoreAlias]
              - [int, purposes, { decoder: bitmask, config: { class: android.security.keystore.KeyProperties, fields: "PURPOSE_*" } }]

  # `constants` with `fields`: the constants of the hooked class whose names match. Cipher declares ENCRYPT_MODE and
  # PUBLIC_KEY, both 1, so `*_MODE` picks the constants of `opmode`.
  # Docs: https://developer.android.com/reference/javax/crypto/Cipher#init(int,%20java.security.Key,%20java.security.spec.AlgorithmParameterSpec)
  - javaClass: javax.crypto.Cipher
    hooks:
      - method: init
        overloads:
          - params:
              - [int, opmode, { decoder: constants, config: { fields: "*_MODE" } }]
              - [java.security.Key, key]
              - [java.security.spec.AlgorithmParameterSpec, params]

  # `bitmask` with `fields`: the Intent.FLAG_* constants set in a bitmask
  # Docs: https://developer.android.com/reference/android/content/Intent#setFlags(int)
  - javaClass: android.content.Intent
    hooks:
      - method: setFlags
        overloads:
          - params:
              - [int, flags, { decoder: bitmask, config: { fields: "FLAG_*" } }]

      # the Intent.URI_* constants set in a bitmask
      # Docs: https://developer.android.com/reference/android/content/Intent#parseUri(java.lang.String,%20int)
      - method: parseUri
        overloads:
          - params:
              - [java.lang.String, uri]
              - [int, flags, { decoder: bitmask, config: { fields: "URI_*" } }]

# Expected values (argsIn):
#   receiveTextBytes:  "Hello frooky"
#   receivePassword:   "s3cr3t"
#   receiveByteArray:  "0x010203"
#   receiveInt:        "0x7fffffff"
#   receiveBase64:     "Hello frooky", and "0x000102030405060708090a0b0c0d0e0f" (a second event)
#   receiveProfile:    [{name: age, value: 42}, {name: name, value: "alice"}, {name: admin, value: true}] (in the order of reflection)
#   receiveBigInteger: "java.math.BigInteger@<identity hash code>"
#   receiveMode:       mode "MODE_DECRYPT", and opmode "DECRYPT" (a second event)
#   Builder.$init:     keystoreAlias "TestKeyPair", purposes ["PURPOSE_SIGN", "PURPOSE_VERIFY"]
#   Cipher.init:       opmode "ENCRYPT_MODE"
#   setFlags:          [FLAG_GRANT_READ_URI_PERMISSION, ..., FLAG_ACTIVITY_NEW_TASK, FLAG_ACTIVITY_CLEAR_TASK]
#   parseUri:          flags [URI_INTENT_SCHEME]
