metadata:
  name: "Basic Hooking (Android): Method Wildcards"
  description: |
    A `*` in a method name matches any characters, also none. frooky hooks every overload of each
    method of the class whose name matches, but no inherited method and no constructor.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-java (MastgTest.kt), press "Start".
# Run:    frooky -U -f value_passing_java.frooky.target.app docs/examples/android/01_basic_hooking/05_method_wildcards.yaml
# See:    docs/java-hook-declaration.md#method-wildcards

hookCollection:
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      # receiveBoolean(Boolean) and receiveBooleanArray(BooleanArray)
      - receiveBoolean*

# Expected events:
#   receiveBoolean:      argsIn [{type: boolean, value: true}]
#   receiveBooleanArray: argsIn [{type: "[Z", value: [true, false]}]
