metadata:
  name: Android Live Reload and Watch Testing
  description: |
    Tests frooky's file watching and live reload functionality (-w / --watch).
    Run frooky with:
      frooky -U -f org.owasp.mastestapp -w docs/examples/android/04_watch.yaml
    Then edit this file (e.g. add/remove hooks or filters) to observe
    dynamic reload without restarting the target process.
  version: 1
  author: frooky dev
  platform: Android

hookCollection:
  # String parameter with maxItems limit
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: receiveString
        overloads:
          - params:
              - [java.lang.String, receivedString, { maxItems: 10 }]

  # Integer parameter with regex argFilter
  - javaClass: org.owasp.mastestapp.MastgTest
    hooks:
      - method: receiveInt
        overloads:
          - params:
              - [int, integer, { maxItems: 10, argFilter: ["^2147483647$", "^23$"] }]

  # Android EncryptedSharedPreferences Editor
  - javaClass: androidx.security.crypto.EncryptedSharedPreferences$Editor
    hooks:
      - putString
      - putStringSet
