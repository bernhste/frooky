metadata:
  name: Native Target App Testing (value-passing-native)
  version: 1
  author: frooky dev
  platform: Android

# Global settings for the hooks in this hook file.
settings:
  hookSettings:
    platformStackTrace: true
    nativeStackTrace: true
    maxStackFrames: 5                # Sets maxStackFrames to 5 for all hooks
  decoderSettings:
    # Cutoff limit for recursion depth when decoding nested data structures
    maxDepth: 1
    # Limit of how many elements of enumerable data structures are decoded
    maxItems: 11

hookCollection:
  - module: libcrypto.so
    hooks:
      - X509_new
      - symbol: RSA_parse_public_key
      - EVP_EncryptUpdate
      - HMAC
      - RSA_public_encrypt
      - EVP_DecryptUpdate
      - EVP_DigestUpdate

  # Decode arguments passed by value
  - module: libreceiveFundamentalValue.so
    hooks:
      - symbol: receive_bool
        retType: bool
        params:
          - [bool, falseBool]
          - [bool, trueBool]
      - symbol: receive_char
        retType: char
        params:
          - [char, minAscii]
          - [char, maxAscii]
      - symbol: receive_schar
        retType: schar
        params:
          - [schar, minSchar]
          - [schar, maxSchar]
      - symbol: receive_uchar
        retType: uchar
        params:
          - [uchar, minUchar]
          - [uchar, maxUchar]
      - symbol: receive_short
        retType: short
        params:
          - [short, minShort]
          - [short, maxShort]
      - symbol: receive_ushort
        retType: ushort
        params:
          - [ushort, minUshort]
          - [ushort, maxUshort]
      - symbol: receive_int
        retType: int
        params:
          - [int, minInt]
          - [int, maxInt]
      - symbol: receive_uint
        retType: uint
        params:
          - [uint, minUint]
          - [uint, maxUint]
      - symbol: receive_long
        retType: long
        params:
          - [long, minLong]
          - [long, maxLong]
      - symbol: receive_ulong
        retType: ulong
        params:
          - [ulong, minUlong]
          - [ulong, maxUlong]
      - symbol: receive_llong
        retType: llong
        params:
          - [llong, minLlong]
          - [llong, maxLlong]
      - symbol: receive_ullong
        retType: ullong
        params:
          - [ullong, minUllong]
          - [ullong, maxUllong]
      - symbol: receive_float
        retType: float
        params:
          - [float, minFloat]
          - [float, maxFloat]
      - symbol: receive_double
        retType: double
        params:
          - [double, minDouble]
          - [double, maxDouble]

  # Decode arguments passed by reference
  - module: libreceiveFundamentalReference.so
    hooks:
      - symbol: receive_bool_ref
        retType: bool*
        params:
          - [bool*, falseBoolRef]
          - [bool*, trueBoolRef]
      - symbol: receive_char_ref
        retType: char*
        params:
          - [char*, minAsciiRef]
          - [char*, maxAsciiRef]
      - symbol: receive_schar_ref
        retType: schar*
        params:
          - [schar*, minScharRef]
          - [schar*, maxScharRef]
      - symbol: receive_uchar_ref
        retType: uchar*
        params:
          - [uchar*, minUcharRef]
          - [uchar*, maxUcharRef]
      - symbol: receive_short_ref
        retType: short*
        params:
          - [short*, minShortRef]
          - [short*, maxShortRef]
      - symbol: receive_ushort_ref
        retType: ushort*
        params:
          - [ushort*, minUshortRef]
          - [ushort*, maxUshortRef]
      - symbol: receive_int_ref
        retType: int*
        params:
          - [int*, minIntRef]
          - [int*, maxIntRef]
      - symbol: receive_uint_ref
        retType: uint*
        params:
          - [uint*, minUintRef]
          - [uint*, maxUintRef]
      - symbol: receive_long_ref
        retType: long*
        params:
          - [long*, minLongRef]
          - [long*, maxLongRef]
      - symbol: receive_ulong_ref
        retType: ulong*
        params:
          - [ulong*, minUlongRef]
          - [ulong*, maxUlongRef]
      - symbol: receive_llong_ref
        retType: llong*
        params:
          - [llong*, minLlongRef]
          - [llong*, maxLlongRef]
      - symbol: receive_ullong_ref
        retType: ullong*
        params:
          - [ullong*, minUllongRef]
          - [ullong*, maxUllongRef]
      - symbol: receive_float_ref
        retType: float*
        params:
          - [float*, minFloatRef]
          - [float*, maxFloatRef]
      - symbol: receive_double_ref
        retType: double*
        params:
          - [double*, minDoubleRef]
          - [double*, maxDoubleRef]

  # Decode argument: null terminated string
  - module: libreceiveString.so
    hooks:
      - symbol: receive_cstring
        params:
          - [char *, string]
      - symbol: receive_utf8
        params:
          - [char *, { direction: inout }]

  # Use parameter to decode a native uchar *
  - module: libreceiveFundamentalReference.so
    hooks:
      - symbol: receive_byte_array
        params:
          - [unsigned char *, data, { decoderArg: length, direction: inout }]
          - [int, length]
      - symbol: reverse_byte_array
        params:
          - [unsigned char *, data, { decoderArg: length, direction: inout }]
          - [int, length]

  # Decode argument: null terminated string with stack trace
  - module: libreceiveString.so
    hookSettings:
      maxStackFrames: 10
    hooks:
      - symbol: receive_cstring
        params:
          - [char *, string]
      - symbol: receive_utf8
        params:
          - [char *, string]

  # Hook with named parameters and filters (both argument and stack trace)
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hookSettings:
      platformStackTrace: true                        # Required for stackTraceFilter to inspect platform frames
      nativeStackTrace: false                         # Override global settings: disable native unwinding on libc to avoid recursion
      maxStackFrames: 10
      stackTraceFilter: ['^org\.owasp\.mastestapp']
    hooks:
      - symbol: open
        retType: int
        params:
          - [const char *, path, { argFilter: ['^/sdcard', '^/storage/emulated'] }] # Evaluated first; non-matching calls return early before stack trace is built
          - [int, flags]
          - [mode_t, mode]

  # Hook with parameter filter and platform stack trace
  - module: libc.so
    hookSettings:
      platformStackTrace: true                        # Captures platform stack trace for calls matching argFilter
      nativeStackTrace: false                         # Override global settings: disable native unwinding on libc
      maxStackFrames: 10
    hooks:
      - symbol: open
        retType: int
        params:
          - [const char *, path, { argFilter: ['^/sdcard', '^/storage/emulated'] }]
          - [int, flags]
          - [mode_t, mode]

  # Hook with stack traces completely disabled (safest for high-frequency low-level functions)
  - module: libc.so
    hookSettings:
      platformStackTrace: false
      nativeStackTrace: false                         # Override global settings: disable native unwinding for low-level functions
      maxStackFrames: 0
    hooks:
      - symbol: open
        retType: int
        params:
          - [const char *, path]
          - [int, flags]
          - [mode_t, mode]
