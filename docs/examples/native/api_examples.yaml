metadata:
  name: Native Hook Examples
  platform: Android
  description: Examples of native C/C++ function hooking
  category: GENERAL
  author: frooky dev team
  version: 1

hookCollection:
  # Hook multiple functions by name (all symbols in a module).
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  # Docs: https://www.man7.org/linux/man-pages/man2/close.2.html
  - module: libc.so
    hooks:
    - open
    - close

  # Hook functions using explicit object syntax.
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  # Docs: https://www.man7.org/linux/man-pages/man2/close.2.html
  - module: libc.so
    hooks:
    - symbol: open
    - symbol: close

  # Hook with unnamed parameter types and return type (type information required for decoding).
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hooks:
    - symbol: open
      retType: int
      params:
      - "const char *"
      - int
      - mode_t

  # Hook with named parameters (names provide context in output).
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path]
      - [int, flags]
      - [mode_t, mode]

  # Hook multiple functions from the same module with various parameter counts.
  # The EVP_* functions live in libcrypto.so, not libssl.so (Android ships BoringSSL).
  # `out` and `outl` are filled by the call, so they are decoded on exit (`direction: out`).
  # Docs: https://docs.openssl.org/master/man3/EVP_EncryptInit/
  - module: libcrypto.so
    hooks:
    - symbol: EVP_CIPHER_CTX_new
      retType: "EVP_CIPHER_CTX *"
    - symbol: EVP_CIPHER_CTX_free
      params:
      - ["EVP_CIPHER_CTX *", ctx]
    - symbol: EVP_EncryptUpdate
      retType: int
      params:
      - ["EVP_CIPHER_CTX *", ctx]
      - ["unsigned char *", out, { direction: out, decoderArgs: { length: outl } }]
      - ["int *", outl, { direction: out }]
      - ["const unsigned char *", in, { decoderArgs: { length: inl } }]
      - [int, inl]

  # `key` and `iv` have no length parameter: their lengths depend on the cipher (e.g. 32 and 12 bytes for
  # AES-256-GCM), which no decoder reads from `type`. As `void *`, they are shown as their addresses.
  # Docs: https://docs.openssl.org/master/man3/EVP_EncryptInit/
  - module: libcrypto.so
    hookSettings:
      maxStackFrames: 10
    hooks:
    - symbol: EVP_EncryptInit_ex
      retType: int
      params:
      - ["EVP_CIPHER_CTX *", ctx]
      - ["const EVP_CIPHER *", type]
      - ["ENGINE *", impl]
      - ["const void *", key]
      - ["const void *", iv]

  # The role `length` passes the length of `buf`, since it isn't NUL-terminated.
  # Docs: https://docs.openssl.org/master/man3/SSL_write/
  - module: libssl.so
    hooks:
    - symbol: SSL_write
      retType: int
      params:
      - ["SSL *", ssl]
      - ["const void *", buf, { decoderArgs: { length: num } }]
      - [int, num]


  # `read` writes up to `count` bytes into `buf` and returns how many it wrote, so `buf` is decoded on return
  # (`direction: out`) with the return value in the role `length` (`decoderArgs: { length: $ret }`). A return value of -1 (an
  # error) decodes `buf` as null. `decoder: fd` shows the file, socket or pipe that `fd` refers to.
  # Docs: https://www.man7.org/linux/man-pages/man2/read.2.html
  - module: libc.so
    hooks:
    - symbol: read
      retType: ssize_t
      params:
      - [int, fd, { decoder: fd }]
      - [void *, buf, { direction: out, decoderArgs: { length: $ret }, decoder: string, maxItems: 100 }]
      - [size_t, count]

  # The same for TLS: the plaintext an app receives, before it's parsed.
  # Docs: https://docs.openssl.org/master/man3/SSL_read/
  - module: libssl.so
    hooks:
    - symbol: SSL_read
      retType: int
      params:
      - ["SSL *", ssl]
      - ["void *", buf, { direction: out, decoderArgs: { length: $ret }, decoder: string }]
      - [int, num]

  # Use `decoder: string` to decode a buffer as text instead of hex/ASCII.
  # The role `length` passes the buffer length, since `buf` is not NUL-terminated.
  # Docs: https://www.man7.org/linux/man-pages/man2/write.2.html
  - module: libc.so
    hooks:
    - symbol: write
      retType: ssize_t
      params:
      - int
      - [const void *, buf , { decoderArgs: { length: count }, decoder: string, maxItems: 200 }]
      - [size_t, count]

  # Flags and enums of system calls with the built-in presets, e.g. `open` flags as ["O_WRONLY", "O_CREAT"].
  # The presets have the values of Android and iOS.
  # Docs: https://www.man7.org/linux/man-pages/man2/openat.2.html
  # Docs: https://www.man7.org/linux/man-pages/man2/mmap.2.html
  # Docs: https://www.man7.org/linux/man-pages/man2/socket.2.html
  # Docs: https://www.man7.org/linux/man-pages/man3/dlopen.3.html
  - module: libc.so
    hooks:
    - symbol: openat
      retType: [int, { decoder: fd }]
      params:
      - [int, dirfd]
      - [const char *, path]
      - [int, flags, { decoder: openFlags }]
      - [mode_t, mode]
    - symbol: mmap
      retType: void *
      params:
      - [void *, addr]
      - [size_t, length]
      - [int, prot, { decoder: mmapProt }]
      - [int, flags, { decoder: mmapFlags }]
      - [int, fd, { decoder: fd }]
      - [off_t, offset]
    - symbol: mprotect
      retType: int
      params:
      - [void *, addr]
      - [size_t, length]
      - [int, prot, { decoder: mmapProt }]
    - symbol: socket
      retType: [int, { decoder: fd }]
      params:
      - [int, domain, { decoder: socketDomain }]
      - [int, type, { decoder: socketType }]
      - [int, protocol]
  - module: libdl.so
    hooks:
    - symbol: dlopen
      retType: void *
      params:
      - [const char *, filename]
      - [int, flags, { decoder: dlopenFlags }]

  # The command lines of programs the app starts: `argv` and `envp` end at a NULL pointer.
  # Docs: https://www.man7.org/linux/man-pages/man2/execve.2.html
  - module: libc.so
    hooks:
    - symbol: execve
      retType: int
      params:
      - [const char *, path]
      - ["char *const []", argv, { decoder: nullTerminated }]
      - ["char *const []", envp, { decoder: nullTerminated, maxItems: 20 }]

# demos/ios/MASVS-AUTH/MASTG-DEMO-0043/hooks.js
  - module: Security
    hooks:
      - symbol: SecAccessControlCreateWithFlags
        retType: pointer
        params:
          - [pointer, allocator]
          - [pointer, protection]
          - [uint32, flags]
          - [pointer, error]
          - [pointer, accessControl, { direction: inout }]

  # Keep only the files the app's Java code opens on external storage. `argFilter` is checked first, so
  # only matching calls pay for the stack trace. Replace com.example.app with the app's package.
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hookSettings:
      platformStackTrace: true
      stackTraceFilter: ['^com\.example\.app\.']
    hooks:
    - symbol: open
      retType: int
      params:
      - [const char *, path, { argFilter: ['^/sdcard', '^/storage/emulated']}]
      - [int, flags]
      - [mode_t, mode]
  # Hook functions without an exported symbol by their offset from the module's base address,
  # e.g. found by reverse engineering a stripped library. Offsets fit only one build and ABI of the
  # module; replace libfoo.so and the offsets with your own. See docs/native-hook-declaration.md.
  # Docs: https://frida.re/docs/javascript-api/#module
  - module: libfoo.so
    hooks:
    - offset: 0x1a2b4
      retType: int
      params:
      - [const char *, input]
      - [size_t, length]
    - offset: "0x000000000001C3D0"
