metadata:
  name: "Settings Precedence (Native): Default"
  description: |
    No settings are declared, so the hard-coded defaults apply: no stack traces, and values are
    decoded up to 100 items (here: characters).
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file `settings` < hook collection < hook < parameter/return type.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-native test app, which calls receive_cstring("Welcome the first OWASP MASCon, CString!") once from JNI.

hookCollection:
  - module: libreceiveString.so
    hooks:
      - symbol: receive_cstring
        params:
          - ["char *", s]
        retType: "char *"

# Expected event after pressing Start:
#   stackTrace:        empty (default: stack traces are off)
#   argsIn[0].value:   "Welcome the first OWASP MASCon, CString!" (default)
#   returnValue.value: "Welcome the first OWASP MASCon, CString!" (default)
