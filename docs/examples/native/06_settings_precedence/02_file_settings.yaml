metadata:
  name: "Settings Precedence (Native): File"
  description: |
    The file-level `settings` override the defaults for every hook in the file.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file `settings` < hook collection < hook < parameter/return type.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-native test app, which calls receive_cstring("Welcome the first OWASP MASCon, CString!") once from JNI.

settings:
  hookSettings:
    platformStackTrace: true
    nativeStackTrace: true
    maxStackFrames: 1
    callerFilter: ['^libreceiveString\.so$']
  decoderSettings:
    maxItems: 10

hookCollection:
  - module: libreceiveString.so
    hooks:
      - symbol: receive_cstring
        params:
          - ["char *", s]
        retType: "char *"

# Expected event after pressing Start:
#   stackTrace:        1 frame in platformStackTrace and nativeStackTrace (file: maxStackFrames 1); the callerFilter keeps the event, as libreceiveString.so calls receive_cstring
#   argsIn[0].value:   "Welcome th..."                          (file: maxItems 10)
#   returnValue.value: "Welcome th..."                          (file: maxItems 10)
