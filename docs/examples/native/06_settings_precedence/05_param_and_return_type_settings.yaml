metadata:
  name: "Settings Precedence (Native): Parameter and Return Type"
  description: |
    Decoder settings on a parameter or the return type are the closest level. They override all
    other levels for that one value. There are no hook settings at this level.
  version: 1
  author: frooky dev
  platform: Android

# Levels, from farthest to closest: default < file < hook collection < hook < parameter/return value.
# See docs/additional-features.md#settings-precedence.
# Target: the value-passing-native test app, which calls receive_cstring("Welcome the first OWASP MASCon, CString!") once from JNI.

hookSettings:
  javaStackTrace: true
  nativeStackTrace: true
  maxStackFrames: 1
  callerFilter:
    - libreceiveString.so
decoderSettings:
  maxItems: 10

hookCollections:
  - module: libreceiveString.so
    hookSettings:
      maxStackFrames: 2
    decoderSettings:
      maxItems: 15
    hooks:
      - symbol: receive_cstring
        hookSettings:
          maxStackFrames: 3
        decoderSettings:
          maxItems: 20
        params:
          - ["char *", s, { maxItems: 25 }]
        returns: ["char *", { maxItems: 30 }]

# Expected event after pressing Start:
#   stackTrace:        3 frames in javaStackTrace and nativeStackTrace (hook: maxStackFrames 3); the callerFilter keeps the event, as libreceiveString.so calls receive_cstring
#   argsIn[0].value:   "Welcome the first OWASP M..."           (parameter: maxItems 25)
#   returnValue.value: "Welcome the first OWASP MASCon..."      (return type: maxItems 30)
