metadata:
  name: Native Pointer and Offset Hooking (x86_64)
  description: |
    Demonstrates hooking unexported or stripped native functions by memory offset
    from the library base, as well as decoding pointers and buffers with decoderArg.
  version: 1
  author: frooky dev
  platform: Android

# The offsets below are valid for the x86_64 build of
# tests/target-apps/android/value-passing-native. Other ABIs or rebuilds with a
# different toolchain need new offsets (nm -D --defined-only <lib>.so).

settings:
  hookSettings:
    maxStackFrames: 10
    stackTraceFilter: ['^(?!android).*']
  decoderSettings:
    maxDepth: 1
    maxItems: 11

hookCollection:
  # Hook by offset provided as YAML integer
  - module: libreceiveFundamentalValue.so
    hooks:
      - offset: 0xe60             # receive_bool

  # Hook by offset provided as hex string with leading zeros
  - module: libreceiveFundamentalValue.so
    hooks:
      - offset: "0x0000000000000EE0"  # receive_short

  # Partial local hook settings take priority over global settings
  - module: libreceiveFundamentalValue.so
    hookSettings:
      maxStackFrames: 0
    decoderSettings:
      maxItems: 22
    hooks:
      - offset: 0xf20             # receive_int
        params: [int]
      - offset: 0xe80             # receive_char
        params: [char]

  # Decode argument: null-terminated string
  - module: libreceiveString.so
    hookSettings:
      maxStackFrames: 0
    hooks:
      - offset: 0x7a0             # receive_cstring
        params:
          - [char *, string]
      - offset: 0x7b0             # receive_utf8
        params:
          - [char *, string]

  # Partial local hook settings take priority over global settings
  - module: libreceiveFundamentalValue.so
    decoderSettings:
      maxItems: 33
    hooks:
      - offset: 0xf40             # receive_long

  # Object with only offset provided
  - module: libreceiveFundamentalValue.so
    decoderSettings:
      maxItems: 44
    hooks:
      - offset: 0xea0             # receive_schar
      - offset: 0xfa0             # receive_ullong

  # Local parameter types without names: [type, type]
  - module: libreceiveFundamentalValue.so
    hooks:
      - offset: 0xf80             # receive_llong
        params: [llong, llong]

  # Local parameter types with names: [type, name]
  - module: libreceiveFundamentalValue.so
    hooks:
      - offset: 0xfa0             # receive_ullong
        params:
          - [ullong, minValue]
          - [ullong, maxValue]

  # Use parameter to decode a native buffer (uchar *) with length and string decoder
  - module: libreceiveFundamentalReference.so
    hooks:
      - offset: 0x10b0            # receive_byte_array
        params:
          - [unsigned char *, data, { decoderArg: length, decoder: string }]
          - [int, length]
