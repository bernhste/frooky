metadata:
  name: "Decoders (Native): Pointers and Arrays"
  description: |
    A pointer is read as its declared type: `int *` as one int, `char **` by following both pointers to
    the string. With the role `length` of `decoderArgs`, a pointer is an array with that many elements.
    With `decoder: nullTerminated`, it is an array that ends at a NULL pointer, like argv.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native (cpp/*.c), press "Start".
# Run:    frooky -U -f value_passing_native.frooky.target.app docs/examples/native/03_decoders/02_pointers_and_arrays.yaml
# See:    docs/decoders-native.md#pointers-and-arrays
#
# For `void *`, `char *` and `unsigned char *`, the role `length` is the length of the buffer in bytes instead
# (see 01_strings_and_buffers.yaml).

hookCollection:
  - module: libreceiveFundamentalReference.so
    hooks:
      # int sum_ints(const int *values, int count): an array of `count` ints
      - symbol: sum_ints
        retType: int
        params:
          - ["const int *", values, { decoderArgs: { length: count } }]
          - [int, count]

      # int count_chars(const char **strings, int count): an array of `count` strings, like argv
      - symbol: count_chars
        params:
          - ["const char **", strings, { decoderArgs: { length: count } }]
          - [int, count]

      # int count_args(char *const argv[]) of the target app takes a NULL-terminated array of strings, in the
      # same format as the argv of execve(2)
      # Docs: https://www.man7.org/linux/man-pages/man2/execve.2.html
      - symbol: count_args
        retType: int
        params:
          - ["char *const []", argv, { decoder: nullTerminated }]

      # int get_version(const char **out) points `*out` to a string, so `out` is decoded on return
      - symbol: get_version
        params:
          - ["const char **", out, { direction: out }]

# Expected values:
#   sum_ints:    argsIn [{name: values, value: [3, 1, 4, 1, 5]}, {name: count, value: 5}], returnValue 14
#   count_chars: argsIn [{name: strings, value: ["alpha", "beta", "gamma"]}, {name: count, value: 3}]
#   count_args:  argsIn [{name: argv, value: ["ls", "-l", "/sdcard"]}], returnValue 3
#   get_version: argsOut [{name: out, value: "1.2.3"}]
