metadata:
  name: "Basic Hooking (Native): Hook Functions by Symbol"
  description: |
    A native function has no type information at runtime. The short form hooks a function by its
    exported symbol and records each call without decoding anything. Declare `params` and `retType`
    to decode arguments and the return value.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native (cpp/*.c), press "Start".
# Run:    frooky -U -f value_passing_native.frooky.target.app docs/examples/native/01_basic_hooking/01_hook_by_symbol.yaml
# See:    docs/native-hook-declaration.md#basic-usage

hookCollection:
  - module: libreceiveFundamentalValue.so
    hooks:
      # short form: no arguments or return value
      - receive_bool
      # object form with types: int receive_int(int minValue, int maxValue)
      - symbol: receive_int
        retType: int
        params: [int, int]

# Expected events:
#   receive_bool: argsIn [], no returnValue
#   receive_int:  argsIn [{type: int, value: -2147483648}, {type: int, value: 2147483647}], returnValue -2147483648
