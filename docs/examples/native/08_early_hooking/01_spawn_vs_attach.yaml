metadata:
  name: "Early Hooking (Native): Spawn vs. Attach"
  description: |
    Code that runs while the app starts, e.g. loading its native libraries, only shows up if frooky
    starts the app itself.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native, which loads its libraries at startup.
# See:    docs/native-hook-declaration.md
#
# Spawn (-f): frooky starts the app suspended, installs the hooks, then resumes it. The library loads are recorded:
#   frooky -U -f value_passing_native.frooky.target.app docs/examples/native/08_early_hooking/01_spawn_vs_attach.yaml
#
# Attach (-n, -N, -p): the app already runs, so its libraries are already loaded and nothing is recorded:
#   frooky -U -N value_passing_native.frooky.target.app docs/examples/native/08_early_hooking/01_spawn_vs_attach.yaml
#
# A hook on a function in the app's own library (e.g. libreceiveString.so) is installed as soon as the
# library loads, before its constructors and JNI_OnLoad run (see 02_calls_while_loading.yaml), also when the
# app loads it much later. After 5 seconds (-t), frooky reports it as waiting.
# Hook the loader, as below, to see which libraries the app loads.
# Hooking the loader breaks loads from other linker namespaces, see docs/native-hook-declaration.md.

hookCollection:
  # void *android_dlopen_ext(const char *filename, int flags, const android_dlextinfo *extinfo)
  # Docs: https://developer.android.com/ndk/reference/group/libdl#android_dlopen_ext
  - module: libdl.so
    hooks:
      - symbol: android_dlopen_ext
        params:
          # the path is longer than the default maxItems: 100, and argFilter matches the cut value
          - ["char *", filename, { maxItems: 500, argFilter: ['/libreceive\w+\.so$'] }]
          - [int, flags, { decoder: dlopenFlags }]

# Expected events:
#   spawn:  3 events, filename ".../base.apk!/lib/<abi>/libreceiveFundamentalValue.so",
#           ".../libreceiveFundamentalReference.so" and ".../libreceiveString.so", each with flags ["RTLD_NOW"]
#   attach: none
