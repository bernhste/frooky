metadata:
  name: "Hook Settings (Native): Low-Level Functions"
  description: |
    Functions such as libc's open run very often and in many contexts. Keep stack traces off for them
    and narrow the events down with `argFilter` instead.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native (cpp/*.c), press "Start".
# Run:    frooky -U -f value_passing_native.frooky.target.app docs/examples/native/05_hook_settings/03_low_level_functions.yaml
# See:    docs/additional-features.md#event-filter-based-on-stack-trace
#
# Why stack traces are risky here:
# - A native stack walk can call the hooked function again (e.g. open while reading a module), which recurses.
# - Low-level functions may run on a small signal stack, which a stack walk overflows. On a signal stack,
#   frooky captures no frames at all.
# - Every call pays for the stack walk, which slows the whole app down.
# `argFilter` is checked before any stack trace is built, so non-matching calls stay cheap.

hookCollection:
  # int open(const char *pathname, int flags, mode_t mode)
  # Docs: https://www.man7.org/linux/man-pages/man2/open.2.html
  - module: libc.so
    hooks:
      - symbol: open
        retType: int
        params:
          # read_status() in libreceiveString.so opens this file once per "Start"
          - ["char *", path, { argFilter: ['^/proc/self/status$'] }]
          - [int, flags]

# Expected events:
#   open: path "/proc/self/status", flags 0 (O_RDONLY), returnValue a file descriptor, stackTrace empty
