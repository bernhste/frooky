metadata:
  name: "Hook Settings (Native): stackTraceFilter"
  description: |
    `stackTraceFilter` only records a call if a captured frame matches one of the regular expressions,
    e.g. to keep the calls made by the app's own code and drop those made through a library.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native (cpp/*.c), press "Start".
# Run:    frooky -U -f value_passing_native.frooky.target.app docs/examples/native/05_hook_settings/02_stack_trace_filter.yaml
# See:    docs/additional-features.md#event-filter-based-on-stack-trace
#
# What the filter matches:
# - Each frame on its own, as it appears in the event: native "<symbol>+<offset> (<module>:<address>)",
#   platform "<class>.<method> (<file>:<line>)". Native and platform frames are both searched.
# - Only the captured frames: it needs `nativeStackTrace` or `platformStackTrace`, otherwise every event is
#   dropped, and it only searches the first `maxStackFrames` frames of each trace.
# - If any frame matches, the whole event is kept, with all captured frames.

hookCollection:
  - module: libreceiveString.so
    hookSettings:
      nativeStackTrace: true
      # the first native frame is the direct caller of track_event
      maxStackFrames: 1
      stackTraceFilter: ['^Java_org_owasp_mastestapp_']
    hooks:
      - symbol: track_event
        params:
          - ["char *", name]

# Expected events:
#   track_event: only "button_click". The "sdk_flush" call comes from sdk_flush, which doesn't match.
