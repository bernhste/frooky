metadata:
  name: "Decoder Settings (Native): argFilter"
  description: |
    `argFilter` only records a call if the decoded argument matches one of the regular expressions or numeric comparisons.
    It matches the decoded value as it appears in the event, so after `maxItems` cut it.
  version: 1
  author: frooky dev
  platform: Android

# Target: tests/target-apps/android/value-passing-native (cpp/*.c), press "Start".
# Run:    frooky -U -f value_passing_native.frooky.target.app docs/examples/native/04_decoder_settings/02_arg_filter.yaml
# See:    docs/decoders.md#argfilter-capture-only-matching-values

hookCollection:
  # const char *track_event(const char *name) is called with "button_click" and "sdk_flush"
  - module: libreceiveString.so
    hooks:
      - symbol: track_event
        params:
          - ["char *", name, { argFilter: ["^button_"] }]

# Expected events:
#   track_event: only name "button_click"
