metadata:
  name: iOS Hook Examples
  platform: iOS
  description: Examples of Objective-C and Swift method hooking on iOS
  category: GENERAL
  author: frooky dev team
  version: 1

hookCollection:
  # ---------------------------------------------------------------------------
  # Objective-C: 'objcClass'
  # A selector is prefixed with '-' (instance method) or '+' (class method). Without a prefix, both are hooked.
  # Selectors must be quoted, as the trailing ':' is YAML syntax.
  # Only methods the class implements itself can be hooked, not inherited ones.
  # ---------------------------------------------------------------------------

  # Parameter and return types are read from the method's type encoding.
  # Objects (id) are decoded by their runtime class, e.g. NSData is decoded as hex.
  # Docs: https://developer.apple.com/documentation/foundation/nsdata/datawithbytes:length:
  # Docs: https://developer.apple.com/documentation/foundation/nsdata/write(tofile:atomically:)
  - objcClass: NSData
    hooks:
      - "+dataWithBytes:length:"
      - "-writeToFile:atomically:"

  # An instance method without arguments and a class method.
  # Docs: https://developer.apple.com/documentation/foundation/nsurl/absolutestring
  # Docs: https://developer.apple.com/documentation/foundation/nsurl/urlwithstring:
  - objcClass: NSURL
    hooks:
      - "-absoluteString"
      - "+URLWithString:"

  # Wildcards match every loaded class. '*' matches any characters.
  # Docs: https://developer.apple.com/documentation/foundation/nsurl/init(string:)
  - objcClass: NSURL*
    hooks:
      - "-initWithString:"

  # Settings on collection level.
  # Docs: https://developer.apple.com/documentation/foundation/userdefaults/set(_:forkey:)-8ab6d
  # Docs: https://developer.apple.com/documentation/foundation/userdefaults/object(forkey:)
  - objcClass: NSUserDefaults
    hookSettings:
      maxStackFrames: 8
    decoderSettings:
      maxItems: 200
    hooks:
      - "-setObject:forKey:"
      # [selector, decoderSettings] shorthand: decode all objects with -description
      - ["-objectForKey:", { decoder: string }]

  # Declared params replace the types read from the method. They cover the explicit arguments only (not self and _cmd).
  # Docs: https://developer.apple.com/documentation/foundation/filemanager/createfile(atpath:contents:attributes:)
  - objcClass: NSFileManager
    hooks:
      - method: "-createFileAtPath:contents:attributes:"
        params:
          - [id, path, { argFilter: ["\\.plist$"] }]
          - [id, contents, { decoder: data }]
          - id

  # ---------------------------------------------------------------------------
  # Swift: 'swiftClass', 'swiftStruct', 'swiftEnum'
  # The name can be qualified with the module. Types come from the demangled symbol of the method.
  # Requires an arm64 device and an app with unstripped symbols. 'MyApp' stands for the app's own module.
  # ---------------------------------------------------------------------------

  - swiftClass: MyApp.LoginViewModel
    hooks:
      - authenticate # every overload
      - authenticate(user:password:) # only the overload with these labels ('_' = unlabeled argument)
      - ["logout", { maxDepth: 3 }]

  # Wildcards are matched against 'Module.Type'.
  - swiftClass: MyApp.*ViewModel
    hooks:
      - viewDidLoad

  # Methods of structs and enums are not listed by the Swift bridge. They are found by the symbols of the module.
  - swiftStruct: MyApp.Credentials
    hooks:
      - validate
      - init(user:password:)

  - swiftEnum: MyApp.LoginState
    hooks:
      - isFinal
